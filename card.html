<!DOCTYPE html>
<html>
<head>
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Wittgenstein:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

      <link rel="stylesheet" href="CSS/card.css"/>
</head>

<body>

<div class="container">

  <from action="">
          <div class="row">

            <div class="col">
                  <h3 class="title"> Billing Address</h3>

                            <div class="inputbox">

                                <span>Full Name:</span>
                                <input type="text" placeholder="Mohammad Hossain">

                            </div>

                            <div class="inputbox">

                              <span>Email:</span>
                              <input type="email" placeholder="example@example.com">

                            </div>

                            <div class="inputbox">

                              <span>Address:</span>
                              <input type="text" placeholder="room - street - locality">

                            </div>

                            <div class="inputbox">

                              <span>City:</span>
                              <input type="text" placeholder="Chattogram">

                            </div>
                    <div class="flex">

                                <div class="inputbox">

                                    <span>State:</span>
                                    <input type="text" placeholder="Bangladesh">

                                </div>

                                <div class="inputbox">

                                    <span>Zip Code:</span>
                                    <input type="text" placeholder="123-456">

                                </div>


                    </div>


            </div>

            <div class="col">
                  <h3 class="title"> Payment</h3>

                            <div class="inputbox">

                                <span>Card Accepted:</span> 

                                <img src="img/card.jpg" alr="laoding.."/>

                            </div>

                            <div class="inputbox">

                                <span>Name on card:</span>
                                <input type="text" placeholder="Mohammad Hossain">

                            </div>

                            <div class="inputbox">

                              <span>card Number:</span>
                              <input type="Text" placeholder="1111-2222-3333-4444">

                            </div>

                            <div class="inputbox">

                              <span>Exp Mounth:</span>
                              <input type="text" placeholder="May">

                            </div>


                    <div class="flex">

                                <div class="inputbox">

                                  <span>Exp Year:</span>
                                  <input type="text" placeholder="2001">

                                </div>

                                <div class="inputbox">

                                    <span>CVV:</span>
                                    <input type="text" placeholder="1234">

                                </div>


                    </div>


            </div>

          </div>
          <button type="button"> Purchase to chackout </button>

  </from>

</div>









</body>

</html>
